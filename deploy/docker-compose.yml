# HomeTech Smart Support Desk: the app stack for Portainer (Stacks → Repository,
# compose path deploy/docker-compose.yml). Variables: deploy/stack.env.example.
#
# The shared network must exist on the server (Nginx Proxy Manager is on it):
#   docker network create proxy
# NPM proxy hosts:
#   ai-exam.robodigit.win → <app container>:3000
#   n8n.robodigit.win     → <n8n container>:5678 (Websockets on). A Cloudflare WAF rule
#                           allows only your IP, except /form-waiting/ and /webhook-waiting/.
#
# No service publishes a port. "db" is reachable only on the stack's "backend" network.

services:
  app:
    # Private GHCR image: Portainer pulls it with the "ghcr" registry (PAT with read:packages).
    image: ghcr.io/teodoragardjeva/ai-exam:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}
      # Passwords of the database roles the app creates on start (src/lib/migrate.ts).
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
      N8N_APP_DB_PASSWORD: ${N8N_APP_DB_PASSWORD:?set N8N_APP_DB_PASSWORD}
      N8N_READONLY_DB_PASSWORD: ${N8N_READONLY_DB_PASSWORD:?set N8N_READONLY_DB_PASSWORD}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
      BOT_SECRET: ${BOT_SECRET:?set BOT_SECRET}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      DEMO_ORDER_EMAIL: ${DEMO_ORDER_EMAIL:-}
      DEMO_ORDER_NAME: ${DEMO_ORDER_NAME:-}
      # Staff login (Better Auth). Accounts are created/updated on every start.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://ai-exam.robodigit.win}
      STAFF_MANAGER_EMAIL: ${STAFF_MANAGER_EMAIL:-}
      STAFF_MANAGER_NAME: ${STAFF_MANAGER_NAME:-}
      STAFF_MANAGER_PASSWORD: ${STAFF_MANAGER_PASSWORD:-}
      STAFF_AGENT_EMAIL: ${STAFF_AGENT_EMAIL:-}
      STAFF_AGENT_NAME: ${STAFF_AGENT_NAME:-}
      STAFF_AGENT_PASSWORD: ${STAFF_AGENT_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - proxy

  db:
    # Postgres 17 with pgvector (knowledge base embeddings). n8n 2.x needs Postgres 17+.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # Our n8n image (built from n8n/ by CI): on every start it imports and publishes the
  # workflows from n8n/workflows. Credentials are created once in the n8n UI with the
  # names the workflows use; then restart n8n. See n8n/README.md.
  n8n:
    image: ghcr.io/teodoragardjeva/ai-exam-n8n:latest
    restart: unless-stopped
    environment:
      # n8n keeps its own data in the "n8n" schema, as the restricted "n8n" role.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-app}
      DB_POSTGRESDB_SCHEMA: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
      # Encrypts stored credentials. Never change it after the first start.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ:-Europe/Sofia}
      TZ: ${TZ:-Europe/Sofia}
      # Public URL: links in approval emails (Send and Wait forms) point here.
      N8N_HOST: ${N8N_PUBLIC_HOST:-n8n.robodigit.win}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_PUBLIC_HOST:-n8n.robodigit.win}/
      N8N_EDITOR_BASE_URL: https://${N8N_PUBLIC_HOST:-n8n.robodigit.win}/
      # Behind Cloudflare + NPM.
      N8N_PROXY_HOPS: 2
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_AUTOLOAD_WORKFLOWS: ${N8N_AUTOLOAD_WORKFLOWS:-true}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
      - proxy

volumes:
  db_data:
  n8n_data:

networks:
  backend:
  proxy:
    external: true
