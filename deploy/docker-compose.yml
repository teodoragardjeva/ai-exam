# Website stack for Portainer (Stacks → Add stack → Web editor, paste this file).
# Set the variables from deploy/stack.env.example in Portainer's "Environment variables".
#
# Before deploying, the shared network must exist on the server:
#   docker network create proxy
# Nginx Proxy Manager is on that network and forwards the domain to http://app:3000.
#
# Only "app" joins "proxy". "db" and "n8n" publish no ports and are reachable only
# on the stack's own "backend" network.

services:
  app:
    # Private GHCR image: Portainer pulls it with the "ghcr" registry (PAT with read:packages).
    # "latest" moves with every merge to main and every stable release.
    # For a fixed version use a release tag instead, e.g. :1.0 or :1.0.0.
    image: ghcr.io/teodoragardjeva/ai-exam:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
      BOT_SECRET: ${BOT_SECRET:?set BOT_SECRET}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - proxy

  db:
    # n8n 2.x supports Postgres 17+ (16 only gets "compatibility support").
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    environment:
      # n8n keeps its own data in the "n8n" schema, as the restricted "n8n" role
      # that the app creates on startup (src/instrumentation.ts).
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-app}
      DB_POSTGRESDB_SCHEMA: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
      # Encrypts stored credentials. Never change it after the first start.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ:-Europe/Sofia}
      TZ: ${TZ:-Europe/Sofia}
      # The editor is opened only through an SSH tunnel over plain http.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

volumes:
  db_data:
  n8n_data:

networks:
  backend:
  proxy:
    external: true
