# Nginx Proxy Manager. Run on the server from /opt/nginx-proxy-manager:
#   docker network create proxy   (once, if it doesn't exist)
#   docker compose up -d
# Admin UI on port 81: closed in the Cloud Firewall; reach it through an SSH tunnel:
#   ssh -N -L 8181:127.0.0.1:81 deploy@<server-ip>   then http://localhost:8181
# Proxy host for the site: forward host "app", port 3000, scheme http.

services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - proxy

networks:
  proxy:
    external: true
