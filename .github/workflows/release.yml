name: Release

# Two ways to release, both require a semver version (MAJOR.MINOR.PATCH, optional -prerelease):
#
# 1. Manually: Actions → Release → Run workflow (branch main) → version, e.g. 1.2.3
#    The workflow checks the version, creates the tag v1.2.3 on main and releases it.
# 2. With a tag:  git tag v1.2.3 && git push origin v1.2.3
#    (Creating a release with a new tag in the GitHub UI does the same.)
#
# Publishes ghcr.io/<owner>/<repo>:1.2.3, :1.2 and :latest (and the n8n image
# ghcr.io/<owner>/<repo>-n8n with the same tags), and a GitHub Release with
# notes generated from merged pull requests. A pre-release such as 1.3.0-rc.1 gets only
# its own image tag, never :latest, and is marked as a pre-release on GitHub.
# Anything that isn't semver (v1.2, v1.2.x, 1.2.3+build) stops the release before publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version in semver format, e.g. 1.2.3 or 1.3.0-rc.1 (a leading v is optional)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check semver version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Validate version
        id: check
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run the release from the main branch (you selected $REF_NAME)."
              exit 1
            fi
            raw="$INPUT_VERSION"
          else
            raw="$REF_NAME"
          fi

          raw="$(echo "$raw" | tr -d '[:space:]')"
          version="${raw#v}"
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$version" =~ $re ]]; then
            echo "::error::'$raw' is not a semver version. Use MAJOR.MINOR.PATCH, e.g. 1.2.3 or 1.3.0-rc.1."
            exit 1
          fi
          if [ "$EVENT" = "push" ] && [ "$raw" != "v$version" ]; then
            echo "::error::Release tags must look like v$version (got '$raw')."
            exit 1
          fi

          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true

          echo "Release v$version (prerelease: $prerelease)"
          {
            echo "tag=v$version"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: github.event_name == 'workflow_dispatch'

      - name: Tag must not exist yet (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Choose a new version."
            exit 1
          fi

  checks:
    name: Lint, typecheck, test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  release:
    name: Publish image and GitHub Release
    needs: [version, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Manual run: tag the commit that was checked. A tag pushed with GITHUB_TOKEN
      # does not start this workflow again, so there is no second release run.
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # Pre-releases get only {{version}}; metadata-action skips {{major}}.{{minor}} for them.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: n8n image tags
        id: meta-n8n
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}-n8n
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}

      - name: n8n image (workflows baked in)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: n8n
          push: true
          tags: ${{ steps.meta-n8n.outputs.tags }}
          labels: ${{ steps.meta-n8n.outputs.labels }}
          cache-from: type=gha,scope=n8n
          cache-to: type=gha,mode=max,scope=n8n

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'false' }}
          generate_release_notes: true
